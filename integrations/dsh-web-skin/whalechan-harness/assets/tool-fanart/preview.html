<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px system-ui;background:#edf7fc;color:#142f54;padding:28px}.row{display:flex;gap:24px;margin:20px 0}.card{background:white;border:1px solid #cfe7f4;border-radius:14px;padding:14px;min-width:160px}.light,.dark{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px}.dark{background:#13243a;color:white}.s32{width:32px;height:32px}.s64{width:64px;height:64px}</style></head><body><h1>Whale-chan Fan-art Icon Downscale QA</h1><script>for(const n of ['pwsh','read','edit','web'])document.write(`<div class="row"><div class="card"><b>${n} · 32px</b><div class="light"><img class="s32" src="${n}-32.png">Light</div><div class="dark"><img class="s32" src="${n}-32.png">Dark</div></div><div class="card"><b>${n} · 64px</b><div class="light"><img class="s64" src="${n}-64.png">Light</div><div class="dark"><img class="s64" src="${n}-64.png">Dark</div></div></div>`)</script></body></html>
