<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px system-ui;background:#eef7fc;color:#142f54;padding:28px}.grid{display:grid;grid-template-columns:repeat(5,130px);gap:16px}.card{background:white;border:1px solid #cfe7f4;border-radius:14px;padding:14px;display:flex;align-items:center;gap:9px;box-shadow:0 4px 12px #142f5412}.card img{width:32px;height:32px}.card span{font-weight:650}</style></head><body><h1>Whale-chan Tool Icons v1</h1><div class="grid"><script>for(const n of ['pwsh','read','write','edit','glob','grep','web','image','subagent','workflow','ask','todo','cordis','map','chart','resume','music','memory','deploy','generic'])document.write(`<div class="card"><img src="${n}.svg"><span>${n}</span></div>`)</script></div></body></html>
